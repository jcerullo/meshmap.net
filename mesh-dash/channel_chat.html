                populateChannelDropdown() {
                    if (!App.elements.channelSelector) {
                        console.warn("Channel selector element not found for populating.");
                        return;
                    }
                    const previouslySelectedValue = String(App.state.selectedChannelIndex);
                    App.elements.channelSelector.innerHTML = '';
    
                    const sortedIndices = Object.keys(App.state.availableChannels).map(Number).sort((a, b) => a - b);
    
                    if (sortedIndices.length === 0) {
                        console.error("CRITICAL: No channels available to populate dropdown.");
                        const option = document.createElement('option');
                        option.value = "-1";
                        option.textContent = "No Channels Available";
                        App.elements.channelSelector.appendChild(option);
                        App.elements.channelSelector.disabled = true;
                        App.state.selectedChannelIndex = -1;
                        this.updateChatTitle();
                        return;
                    }
    
                    let selectionMade = false;
                    sortedIndices.forEach(index => {
                        const channelInfo = App.state.availableChannels[index];
                        const name = channelInfo?.name || `Unnamed Channel ${index}`;
                        const role = channelInfo?.role || 'UNKNOWN';
    
                        if (role !== 'DISABLED') {
                            const option = document.createElement('option');
                            option.value = String(index);
                            option.textContent = App.utils.sanitizeText(name);
                            option.title = `Index: ${index}, Role: ${role}`;
                            App.elements.channelSelector.appendChild(option);
    
                            if (option.value === previouslySelectedValue) {
                                option.selected = true;
                                App.state.selectedChannelIndex = index;
                                selectionMade = true;
                            }
                        }
                    });
    
                    if (!selectionMade) {
                        const firstEnabledOption = App.elements.channelSelector.querySelector('option');
                        if (firstEnabledOption) {
                            firstEnabledOption.selected = true;
                            App.state.selectedChannelIndex = parseInt(firstEnabledOption.value, 10);
                            console.log(`Dropdown: Defaulting to first available channel: Name: '${firstEnabledOption.textContent}', Index: ${App.state.selectedChannelIndex}`);
                        } else {
                            console.error("CRITICAL: No ENABLED channels to select in dropdown.");
                            const option = document.createElement('option');
                            option.value = "-1";
                            option.textContent = "No Enabled Channels";
                            App.elements.channelSelector.appendChild(option);
                            App.elements.channelSelector.disabled = true;
                            App.state.selectedChannelIndex = -1;
                        }
                    }
    
                    App.elements.channelSelector.value = String(App.state.selectedChannelIndex);
                    App.elements.channelSelector.disabled = (App.state.selectedChannelIndex === -1 && App.elements.channelSelector.options.length <=1 ) || App.elements.channelSelector.options.length === 0 ;
    
                    this.updateChatTitle();
                    this.updateConnectionStatus(App.elements.statusText.textContent);
    
                    if (App.elements.showEncryptedSettingItem) {
                        App.elements.showEncryptedSettingItem.style.display = (App.state.selectedChannelIndex === 0) ? 'flex' : 'none';
                    }
                },
                updateChatTitle() {
                    const currentChannelInfo = App.state.availableChannels[App.state.selectedChannelIndex];
                    if (App.state.selectedChannelIndex === -1 || !currentChannelInfo) {
                        App.elements.chatTitle.innerHTML = `<i class="fas fa-exclamation-triangle"></i> No Channel Selected`;
                    } else {
                        const channelName = currentChannelInfo.name;
                        App.elements.chatTitle.innerHTML = `<i class="fas fa-comments"></i> ${App.utils.sanitizeText(channelName)} Chat`;
                    }
                },
    
                displayMessage(messageData, isHistory = false) {
                    const {
                        from_id, fromId: fromIdAlt,
                        to_id, toId: toIdAlt,
                        text: rawText, payload,
                        timestamp: msgTimestampRaw, rxTime,
                        channel,
                        rx_snr, rx_rssi,
                        packet_event_id, event_id,
                        telemetry, decoded
                    } = messageData;
    
                    const recipientId = to_id || toIdAlt || messageData.toId;
                    const isLikelyDM = recipientId && recipientId !== '^all' && recipientId !== '!ffffffff';
                    const isPrivatePortnum = decoded?.portnum === 'PRIVATE_APP' || (typeof decoded?.portnum === 'number' && decoded.portnum === 4);
    
                    if (isLikelyDM || isPrivatePortnum) {
                        // console.debug(`Hiding DM/Private (To: ${recipientId}, Portnum: ${decoded?.portnum}) from channel view. Message:`, messageData); // Kept for debugging if needed
                        return;
                    }
    
                    const isOpaqueMessage = decoded?.portnum === 'OPAQUE_APP' || (typeof decoded?.portnum === 'number' && decoded.portnum === 0);
    
                    if (App.state.selectedChannelIndex === 0 && isOpaqueMessage && !App.settings.showEncryptedOnPrimary) {
                        // console.debug("Hiding encrypted/opaque message from Primary Channel due to preference.", messageData); // Kept for debugging
                        return;
                    }
    
                    const senderId = from_id || fromIdAlt || (decoded?.from ? '!' + decoded.from.toString(16) : null);
                    const finalEventId = packet_event_id || event_id;
                    const messageChannel = (typeof channel === 'number') ? channel : (decoded?.channel ?? null);
    
                    if (!senderId) { console.warn("Msg display skipped: Missing senderId", messageData); return; }
    
                    if (messageChannel !== App.state.selectedChannelIndex) {
                        return;
                    }
    
                    let text = App.utils.extractTextFromPayload(rawText ?? decoded?.text ?? decoded?.payload ?? payload);
                    if (!text && (decoded?.portnum === 'TEXT_MESSAGE_APP' && !isHistory)) {
                         console.warn("Msg display skipped: Empty text payload for live TEXT_MESSAGE_APP", messageData); return;
                    }
                    if (decoded?.portnum && decoded.portnum !== 'TEXT_MESSAGE_APP' && !text) {
                        text = `[${decoded.portnum}]`;
                    }
                    if (!text && isHistory && decoded?.portnum !== 'TEXT_MESSAGE_APP') {
                        text = `[${decoded?.portnum || 'UNKNOWN_TYPE'}]`;
                    }
                    // if (!text && !isOpaqueMessage && !isPrivatePortnum) { // Reduce noise for potentially empty relevant messages
                    //     console.debug("Msg display: Potentially empty relevant message, showing for context or if intended.", messageData, "Text:", text);
                    // }
    
                    const displayTimestamp = messageData._sort_timestamp || rxTime || msgTimestampRaw || (decoded?.rxTime) || (Date.now() / 1000); // Use _sort_timestamp if available
                    const finalMsgKey = finalEventId ? `evt-${finalEventId}` : `${senderId}-${messageChannel ?? 'dm_or_opaque'}-${displayTimestamp}-${text.slice(0,50)}`;
                    if (App.state.messageCache.has(finalMsgKey) && !isHistory) { // Allow historical duplicates if IDs are missing, but not live ones
                        console.debug("Duplicate live message blocked by cache:", finalMsgKey); return;
                    }
                    App.state.messageCache.add(finalMsgKey);
                    while (App.state.messageCache.size > App.config.MESSAGE_CACHE_SIZE_LIMIT) {
                        App.state.messageCache.delete(App.state.messageCache.values().next().value);
                    }
    
                    const isFromCurrentUser = App.utils.getIsMsgFromCurrentUser(senderId);
                    const senderName = App.utils.getNodeName(senderId);
                    const senderInitials = App.utils.getNodeInitials(senderId);
                    const accentColor = App.utils.getNodeAccentColor(senderId);
                    const timeStr = App.utils.formatTime(displayTimestamp);
                    const sanitizedMessageText = App.utils.sanitizeText(text || "");
    
                    const messageElement = document.createElement('div');
                    messageElement.className = 'message-item' + (isFromCurrentUser ? ' current-user' : '') + (isHistory ? ' historical-message' : '');
                    messageElement.dataset.senderId = senderId;
                    if (finalEventId) { messageElement.id = `msg-${finalEventId}`; }
    
                    let metaItemsHTML = '';
                    const currentRxSnr = rx_snr ?? decoded?.rxSnr;
                    const currentRxRssi = rx_rssi ?? decoded?.rxRssi;
                    const signal = App.utils.getSignalStrengthClass(currentRxRssi, currentRxSnr);
                    if (signal.class !== 'unknown') { metaItemsHTML += `<div class="message-meta-item" title="Signal: ${signal.label} (RSSI: ${currentRxRssi ?? 'N/A'} dBm, SNR: ${currentRxSnr?.toFixed(1) ?? 'N/A'} dB)"><div class="signal-bars ${signal.class}"><div></div><div></div><div></div><div></div></div></div>`; }
    
                    const distanceMeters = App.utils.getEstimatedDistance(senderId);
                    const distanceStr = App.utils.formatDistance(distanceMeters);
                    if (distanceStr) { metaItemsHTML += `<div class="message-meta-item" title="Est. distance: ~${distanceStr}"><i class="fas fa-map-marker-alt fa-fw"></i> ~${distanceStr}</div>`; }
    
                    let batteryLevel = App.utils.getNodeBatteryLevel(senderId, decoded, telemetry);
                    if (batteryLevel !== null) {
                        const battery = App.utils.getBatteryLevelClass(batteryLevel);
                        metaItemsHTML += `<div class="message-meta-item battery-indicator" title="Battery: ${battery.label}"><i class="fas ${battery.icon} fa-fw battery-icon ${battery.class}"></i> ${battery.label !== 'N/A' ? battery.label : ''}</div>`;
                    }
    
                    if (decoded?.hopLimit !== undefined) { metaItemsHTML += `<div class="message-meta-item message-meta-detail" title="Hop Limit"><i class="fas fa-route fa-fw"></i> HL: ${decoded.hopLimit}</div>`; }
    
                    const nodeDataSource = App.state.nodes[senderId];
                    if (nodeDataSource && App.settings.showExtraMeta) {
                        const hwModel = nodeDataSource.hw_model || nodeDataSource.user?.hwModel || (nodeDataSource.radio && nodeDataSource.radio.chipType);
                        if (hwModel) metaItemsHTML += `<div class="message-meta-item message-meta-detail" title="Hardware Model: ${App.utils.sanitizeText(hwModel)}"><i class="fas fa-microchip fa-fw"></i> ${App.utils.sanitizeText(hwModel)}</div>`;
                        if (nodeDataSource.firmware_version) metaItemsHTML += `<div class="message-meta-item message-meta-detail" title="Firmware: ${App.utils.sanitizeText(nodeDataSource.firmware_version)}"><i class="fas fa-code-branch fa-fw"></i> ${App.utils.sanitizeText(nodeDataSource.firmware_version)}</div>`;
                        metaItemsHTML += `<div class="message-meta-item message-meta-detail" title="Node ID: ${App.utils.sanitizeText(senderId)}"><i class="fas fa-tag fa-fw"></i> ${App.utils.sanitizeText(senderId)}</div>`;
                        const longName = nodeDataSource.user?.longName || nodeDataSource.long_name;
                        if (longName && longName.trim() && longName.trim().toLowerCase() !== senderName.trim().toLowerCase()) {
                            metaItemsHTML += `<div class="message-meta-item message-meta-detail" title="Long Name: ${App.utils.sanitizeText(longName)}"><i class="fas fa-id-card fa-fw"></i> ${App.utils.sanitizeText(longName)}</div>`;
                        }
                    }
    
                    messageElement.innerHTML = `
                        <div class="node-avatar" style="background-color: ${accentColor};" title="Node: ${senderName} (${App.utils.sanitizeText(senderId)})">${senderInitials}</div>
                        <div class="message-content">
                            <div class="message-header">
                                <span class="sender-name" style="${!isFromCurrentUser ? 'color:'+accentColor : ''}">${App.utils.sanitizeText(senderName)}</span>
                                <span class="message-time">${timeStr}</span>
                            </div>
                            <div class="message-text">${sanitizedMessageText}</div>
                            ${metaItemsHTML ? `<div class="message-meta">${metaItemsHTML}</div>` : ''}
                        </div>`;
    
                    App.elements.messageContainer.appendChild(messageElement);
                    let doScroll = false;
                    if (App.settings.autoScroll) {
                        if (!isHistory) {
                            doScroll = true;
                        } else {
                            // For history, only scroll if we were already near the bottom when it was loaded
                            // This prevents jumping to bottom if user scrolled up to read history & more loads.
                            // However, for initial full history load, we usually want to scroll.
                            // The current logic scrolls if we are within 100px of bottom.
                            const mc = App.elements.messageContainer;
                            if (mc.scrollHeight - mc.clientHeight <= mc.scrollTop + 100) doScroll = true;
                        }
                    }
                    if (doScroll) requestAnimationFrame(() => this.scrollToBottom());
                },
                displaySystemMessage(text) {
                    const el = document.createElement('div');
                    el.className = 'system-message';
                    el.textContent = text;
                    App.elements.messageContainer.appendChild(el);
                    if (App.settings.autoScroll) requestAnimationFrame(() => this.scrollToBottom());
                },
                clearMessages() { App.elements.messageContainer.innerHTML = ''; },
                scrollToBottom() { App.elements.messageContainer.scrollTo({ top: App.elements.messageContainer.scrollHeight, behavior: 'smooth' }); },
                updateConnectionStatus(status, error = null) {
                    let safeStatus = typeof status === 'string' ? status.toLowerCase().trim() : App.config.STATUS_TYPES.UNKNOWN;
                    if (typeof status === 'object' && status !== null && status.connection_status) {
                        safeStatus = status.connection_status.toLowerCase().trim();
                        error = status.last_error || error;
                    }
    
                    App.elements.statusText.textContent = safeStatus.charAt(0).toUpperCase() + safeStatus.slice(1);
                    App.elements.statusIndicator.className = 'status-indicator ' + safeStatus;
    
                    App.elements.errorMessage.textContent = error || '';
                    App.elements.errorMessage.classList.toggle('hidden', !error);
    
                    const isConnected = safeStatus === App.config.STATUS_TYPES.CONNECTED || safeStatus === App.config.STATUS_TYPES.ONLINE;
                    const canInteract = isConnected && App.state.selectedChannelIndex !== -1;
    
                    App.elements.messageInput.disabled = !canInteract;
                    App.elements.sendButton.disabled = !canInteract;
    
                    let disableChannelSelector = !(isConnected || safeStatus === App.config.STATUS_TYPES.CONNECTING);
                    if (App.elements.channelSelector && App.state.selectedChannelIndex === -1 && App.elements.channelSelector.options.length > 0 && App.elements.channelSelector.options[0].value === "-1") {
                        disableChannelSelector = true;
                    }
                    if(App.elements.channelSelector) App.elements.channelSelector.disabled = disableChannelSelector;
                },
                updateCharCount() {
                    const count = App.elements.messageInput.value.length;
                    const max = App.config.MAX_MESSAGE_LENGTH;
                    App.elements.charCount.textContent = `${count}/${max}`;
                    App.elements.charCount.className = 'char-count';
                    if (count > max) App.elements.charCount.classList.add('danger');
                    else if (count > max * 0.9) App.elements.charCount.classList.add('warning');
                },
                checkSendLabelVisibility() {
                    if(App.elements.sendTextLabel) App.elements.sendTextLabel.style.display = window.innerWidth <= 640 ? 'none' : 'inline';
                }
            },
    
            sse: {
                connect() {
                    if (App.state.eventSource) {
                        console.log("Closing existing SSE connection.");
                        App.state.eventSource.close();
                    }
                    console.log(`Connecting to SSE: ${App.config.SSE_URL}...`);
                    App.ui.updateConnectionStatus(App.config.STATUS_TYPES.CONNECTING);
                    App.state.isInitialLoadComplete = false; 
                    App.state.isHistoryLoadedForChannel = {}; 
                    App.state.isLocalNodeInfoProcessing = false; 
    
                    App.state.eventSource = new EventSource(App.config.SSE_URL);
    
                    App.state.eventSource.onopen = async () => {
                        console.log('SSE connection opened.');
                        App.ui.updateConnectionStatus(App.config.STATUS_TYPES.CONNECTED);
                        await App.api.fetchMyNodeIdAndUpdateUI();
                        await App.api.fetchChannels(); 
    
                        if (App.state.selectedChannelIndex !== -1 && App.state.availableChannels[App.state.selectedChannelIndex]) {
                            if (!App.state.isHistoryLoadedForChannel[App.state.selectedChannelIndex]) {
                                console.log(`SSE onopen: fetching initial history for channel ${App.state.selectedChannelIndex}`);
                                await App.api.fetchChannelData(App.state.selectedChannelIndex);
                            } else {
                                console.log(`SSE onopen: History for channel ${App.state.selectedChannelIndex} ALREADY marked as loaded.`);
                            }
                        } else if (App.state.selectedChannelIndex === -1) {
                            console.warn("SSE Open: No valid channel selected after fetching channels.");
                            const loadingMsg = Array.from(App.elements.messageContainer.querySelectorAll('.system-message')).find(el => el.textContent.includes('Loading') || el.textContent.includes('Initializing'));
                            if (loadingMsg) loadingMsg.remove();
                            App.ui.displaySystemMessage("No channel selected or available.");
                        }
                        App.state.isInitialLoadComplete = true; 
                        console.log("SSE onopen: Initial load process complete. isInitialLoadComplete set to true.");
                    };
    
                    App.state.eventSource.onerror = (errorEvent) => {
                        console.error('SSE error:', errorEvent);
                        App.state.isInitialLoadComplete = false;
                        if (App.state.eventSource.readyState === EventSource.CLOSED) {
                            App.ui.updateConnectionStatus(App.config.STATUS_TYPES.DISCONNECTED, `Connection lost. Retrying in ${App.config.RETRY_SSE_TIMEOUT / 1000}s...`);
                            setTimeout(() => this.connect(), App.config.RETRY_SSE_TIMEOUT);
                        } else {
                            App.ui.updateConnectionStatus(App.config.STATUS_TYPES.CONNECTING, 'Connection issue, attempting to maintain...');
                        }
                    };
                    this._addEventListeners();
                },
                _addEventListeners() {
                    App.state.eventSource.addEventListener(App.config.SSE_EVENTS.PACKET, (e) => this.handlePacketEvent(e));
                    App.state.eventSource.addEventListener(App.config.SSE_EVENTS.CONNECTION_STATUS, (e) => this.handleConnectionStatusEvent(e));
                    App.state.eventSource.addEventListener(App.config.SSE_EVENTS.ERROR, (e) => this.handleErrorEvent(e));
                    App.state.eventSource.addEventListener(App.config.SSE_EVENTS.NODES, (e) => this.handleNodesEvent(e));
                    App.state.eventSource.addEventListener(App.config.SSE_EVENTS.NODE_UPDATE, (e) => this.handleNodeUpdateEvent(e));
                    App.state.eventSource.addEventListener(App.config.SSE_EVENTS.LOCAL_NODE_INFO, (e) => this.handleLocalNodeInfoEvent(e));
                },
    
                handlePacketEvent(event) {
                    try {
                        const packet = JSON.parse(event.data);
    
                        if (!App.state.isInitialLoadComplete &&
                            packet.app_packet_type !== App.config.MESSAGE_TYPES.MESSAGE &&
                            !(packet.decoded && (
                                packet.decoded.portnum === 'OPAQUE_APP' || packet.decoded.portnum === 0 ||
                                packet.decoded.portnum === 'PRIVATE_APP' || packet.decoded.portnum === 4
                            ))
                           ) {
                            // console.debug("SSE Packet (non-essential or non-message) ignored: Initial channel/history load not complete.");
                            return;
                        }
    
                        const senderId = packet.fromId || (packet.decoded?.from ? '!' + packet.decoded.from.toString(16) : null);
                        if (senderId && (
                            packet.app_packet_type === App.config.MESSAGE_TYPES.TELEMETRY ||
                            packet.app_packet_type === App.config.MESSAGE_TYPES.POSITION ||
                            packet.app_packet_type === App.config.MESSAGE_TYPES.USER_INFO ||
                            (packet.decoded && (packet.decoded.user || packet.decoded.position || packet.decoded.telemetry))
                        )) {
                            const nodeIdStr = String(senderId).startsWith('!') ? String(senderId) : `!${String(senderId)}`;
                            App.state.nodes[nodeIdStr] = {
                                ...App.state.nodes[nodeIdStr],
                                ...packet,
                                ...(packet.decoded || {}),
                                ...(packet.decoded?.user ? { user: packet.decoded.user } : {}),
                                ...(packet.decoded?.position ? { position: packet.decoded.position } : {}),
                                ...(packet.decoded?.telemetry ? { deviceMetrics: packet.decoded.telemetry.deviceMetrics } : {}),
                                lastHeard: packet.rxTime || packet.timestamp || (Date.now()/1000)
                            };
                            App.ui.updateAllMessageStyling();
                        }
    
                        if (packet.app_packet_type === App.config.MESSAGE_TYPES.MESSAGE ||
                            (packet.decoded && (
                                packet.decoded.portnum === 'TEXT_MESSAGE_APP' ||
                                packet.decoded.portnum === 'PRIVATE_APP' || packet.decoded.portnum === 4 ||
                                packet.decoded.portnum === 'OPAQUE_APP' || packet.decoded.portnum === 0
                            ))
                           ) {
                            App.ui.displayMessage({ ...packet }, false);
                        }
    
                    } catch (e) {
                        console.error('Error processing "packet" event:', e, event.data);
                    }
                },
                handleConnectionStatusEvent(event) {
                    try {
                        App.ui.updateConnectionStatus(JSON.parse(event.data));
                    } catch (e) {
                        console.error('Error processing "connection_status" event:', e, event.data);
                    }
                },
                handleErrorEvent(event) {
                    try {
                        let errorMsg = "An unknown error occurred via SSE.";
                        if (event.data) {
                            try {
                                const errorData = JSON.parse(event.data);
                                errorMsg = errorData.detail || errorData.message || JSON.stringify(errorData);
                            } catch(jsonError) {
                                errorMsg = event.data;
                            }
                        } else if (event.message) {
                            errorMsg = event.message;
                        }
                        console.error("SSE received error event:", errorMsg, event);
                        App.ui.updateConnectionStatus(App.config.STATUS_TYPES.ERROR, errorMsg);
                    } catch (e) {
                        console.error('Error processing SSE "error" event itself:', e, event);
                    }
                },
                handleNodesEvent(event) {
                    try {
                        const nodesData = JSON.parse(event.data);
                        const newNodesCache = {};
                        let processedCount = 0;
                        if (typeof nodesData === 'object' && nodesData !== null) {
                            Object.keys(nodesData).forEach(key => {
                                const node = nodesData[key];
                                const nodeId = node?.node_id || (node?.num ? '!' + node.num.toString(16) : key);
                                if (nodeId && nodeId !== 'null') {
                                    newNodesCache[nodeId] = node;
                                    processedCount++;
                                }
                            });
                        }
                        App.state.nodes = newNodesCache;
                        console.log(`SSE: Nodes list full update received (${processedCount} nodes).`);
                        App.ui.updateAllMessageStyling();
                    } catch (e) {
                        console.error('Error processing "nodes" event:', e, event.data);
                    }
                },
                handleNodeUpdateEvent(event) {
                    try {
                        const nodeUpdate = JSON.parse(event.data);
                        const nodeId = nodeUpdate?.node_id || (nodeUpdate?.num ? '!' + nodeUpdate.num.toString(16) : null);
                        if (nodeId && nodeId !== 'null') {
                            App.state.nodes[nodeId] = { ...App.state.nodes[nodeId], ...nodeUpdate };
                            console.log(`SSE: Node ${nodeId} updated.`);
                            App.ui.updateAllMessageStyling();
                        } else {
                            console.warn("SSE: Received node_update without a valid ID:", nodeUpdate);
                        }
                    } catch (e) {
                        console.error('Error processing "node_update" event:', e, event.data);
                    }
                },
                async handleLocalNodeInfoEvent(event) {
    
                    if (App.state.isLocalNodeInfoProcessing) {
                        console.log("SSE: local_node_info processing already in progress. Skipping this event.");
                        return;
                    }
                    App.state.isLocalNodeInfoProcessing = true;
                    console.log("SSE: Received local_node_info update event. Starting processing...");
    
                    try {
                        const localInfo = JSON.parse(event.data);
                        let oldNodeId = App.state.currentUserNodeId;
                        let oldChannelsJsonString = JSON.stringify(
                            Object.values(App.state.availableChannels)
                                .map(ch => ({ index: ch.index, settings: { name: ch.name }, role: ch.role }))
                                .sort((a, b) => a.index - b.index)
                        );
    
                        if (localInfo?.node_id) {
                            App.state.currentUserNodeId = localInfo.node_id;
                            App.state.nodes[App.state.currentUserNodeId] = {
                                ...App.state.nodes[App.state.currentUserNodeId],
                                ...localInfo,
                                node_id: App.state.currentUserNodeId
                            };
                        }
    
                        if (App.state.currentUserNodeId !== oldNodeId) {
                            console.log(`Local node ID changed/confirmed via SSE: ${App.state.currentUserNodeId}.`);
                            App.ui.updateAllMessageStyling();
                        }
    
                        const newChannelsArray = localInfo?.channels_json ? JSON.parse(localInfo.channels_json) : [];
                        const newChannelsJsonString = JSON.stringify(
                            newChannelsArray
                                .map(ch => ({ index: ch.index, settings: { name: ch.settings?.name }, role: ch.role }))
                                .sort((a, b) => a.index - b.index)
                        );
    
                        if (newChannelsJsonString !== oldChannelsJsonString) {
                            console.log("Local info SSE update indicates channel config string changed. Refreshing channel list and UI.");
                            const previouslySelectedChannelIndex = App.state.selectedChannelIndex;
    
                            await App.api.fetchChannels();
    
                            if (App.state.selectedChannelIndex !== -1 && App.state.availableChannels[App.state.selectedChannelIndex]) {
    
                                const selectedChannelChanged = App.state.selectedChannelIndex !== previouslySelectedChannelIndex;
    
                                if (App.state.isInitialLoadComplete || selectedChannelChanged) {
                                    console.log(`Conditions met for history reload: isInitialLoadComplete=${App.state.isInitialLoadComplete}, selectedChannelChanged=${selectedChannelChanged}. Reloading for channel ${App.state.selectedChannelIndex}.`);
                                    App.state.isHistoryLoadedForChannel[App.state.selectedChannelIndex] = false;
                                    App.ui.clearMessages();
                                    App.state.messageCache.clear();
                                    App.ui.displaySystemMessage(`Reloading messages for ${App.state.availableChannels[App.state.selectedChannelIndex]?.name || 'selected channel'} due to config update/switch...`);
                                    await App.api.fetchChannelData(App.state.selectedChannelIndex);
                                } else {
                                    console.log(`Channel config for current channel ${App.state.selectedChannelIndex} updated during initial setup, but selected channel index unchanged. History reload deferred.`);
                                    App.ui.updateChatTitle(); 
                                }
                            } else if (App.state.selectedChannelIndex === -1) {
                                App.ui.clearMessages();
                                App.ui.displaySystemMessage("No valid channels available after configuration update.");
                                App.ui.updateChatTitle();
                            }
                        } else {
                            console.log("Local info SSE update received, but channel configuration string is unchanged.");
                        }
                    } catch (e) {
                        console.error('Error processing "local_node_info" event:', e, event.data);
                    } finally {
                        App.state.isLocalNodeInfoProcessing = false; 
                        console.log("SSE: local_node_info processing finished.");
                    }
                }
            },
    
            utils: {
                getNodeIdHue(nodeId) {
                    try {
                        if (!nodeId || nodeId === App.config.UNKNOWN_USER_ID || !String(nodeId).startsWith('!')) {
                            return App.config.DEFAULT_NODE_ID_HUE;
                        }
                        const idHex = String(nodeId).substring(1);
                        let hash = 0;
                        if (idHex.length === 0) return App.config.DEFAULT_NODE_ID_HUE;
                        for (let i = 0; i < idHex.length; i++) {
                            hash = idHex.charCodeAt(i) + ((hash << 5) - hash);
                            hash = hash & hash;
                        }
                        return Math.abs(hash % 360);
                    } catch {
                        return App.config.DEFAULT_NODE_ID_HUE;
                    }
                },
                getNodeAccentColor(nodeId) {
                    const hue = this.getNodeIdHue(nodeId);
                    return `hsl(${hue}, 70%, 55%)`;
                },
                getNodeName(nodeId) {
                    try {
                        const node = App.state.nodes[nodeId];
                        const idString = String(nodeId || '');
                        let defaultName = idString.startsWith('!') ? idString : (idString ? `!${idString}`: 'Unknown Node');
    
                        if (!node || idString === App.config.UNKNOWN_USER_ID) {
                            return defaultName;
                        }
    
                        const userInfo = node.user;
                        let name = null;
                        if (userInfo) {
                            name = userInfo.shortName?.trim() || userInfo.longName?.trim();
                        }
                        if (!name && node.radio && node.radio.chipType) {
                           name = node.radio.chipType;
                        }
                        if (!name) {
                            name = node.short_name?.trim() || node.long_name?.trim();
                        }
                        return name || defaultName;
                    } catch {
                        return String(nodeId || 'ErrorNode');
                    }
                },
                getNodeInitials(nodeId) {
                    try {
                        const name = this.getNodeName(nodeId);
                        const idStr = String(nodeId || '');
    
                        if (name === idStr || name === `!${idStr}` || name === 'Unknown Node' || name === 'Unnamed Node' || name === App.config.UNKNOWN_USER_ID || name.length <= 2) {
                            const hexPart = idStr.startsWith('!') ? idStr.substring(idStr.length - 2) : idStr.substring(Math.max(0, idStr.length - 2));
                            return (hexPart || '??').toUpperCase();
                        }
    
                        const words = name.split(/[\s_-]+/).filter(word => word.length > 0);
                        if (words.length === 0) return '?';
                        if (words.length === 1) return words[0].substring(0, 2).toUpperCase();
                        return (words[0].charAt(0) + words[words.length - 1].charAt(0)).toUpperCase();
                    } catch {
                        return '??';
                    }
                },
                getSignalStrengthClass(rssi, snr) {
                    const numRssi = (rssi === undefined || rssi === null) ? -Infinity : Number(rssi);
                    const numSnr = (snr === undefined || snr === null) ? -Infinity : Number(snr);
    
                    if (isNaN(numRssi) || numRssi === -Infinity || numRssi === 0) {
                        return { class: 'unknown', label: 'Unknown' };
                    }
                    if (numRssi > -80 && numSnr > 8) return { class: 'excellent', label: 'Excellent' };
                    if (numRssi > -95 && numSnr > 4) return { class: 'good', label: 'Good' };
                    if (numRssi > -110 && numSnr > 0) return { class: 'fair', label: 'Fair' };
                    return { class: 'poor', label: 'Poor' };
                },
                getBatteryLevelClass(batteryLevel) {
                    const numLevel = (batteryLevel === undefined || batteryLevel === null) ? NaN : Number(batteryLevel);
                    if (isNaN(numLevel)) {
                        return { class: 'unknown', icon: 'fa-battery-empty', label: 'N/A'};
                    }
                    const level = Math.max(0, Math.min(100, numLevel));
    
                    if (level > 80) return { class: 'full', icon: 'fa-battery-full', label: `${level}%` };
                    if (level > 50) return { class: 'good', icon: 'fa-battery-three-quarters', label: `${level}%` };
                    if (level > 20) return { class: 'fair', icon: 'fa-battery-half', label: `${level}%` };
                    return { class: 'low', icon: 'fa-battery-quarter', label: `${level}%` };
                },
                formatTime(unixTimestamp) {
                    try {
                        if (!unixTimestamp || isNaN(Number(unixTimestamp))) return '';
                        const date = new Date(Number(unixTimestamp) * 1000);
                        const now = new Date();
                        const isToday = date.toDateString() === now.toDateString();
                        const timeOptions = { hour: '2-digit', minute: '2-digit', hour12: false };
    
                        if (isToday) {
                            return date.toLocaleTimeString([], timeOptions);
                        } else {
                            const dateOptions = { month: 'short', day: 'numeric' };
                            return `${date.toLocaleDateString([], dateOptions)} ${date.toLocaleTimeString([], timeOptions)}`;
                        }
                    } catch (e) {
                        console.error("Time formatting error:", e, "Timestamp:", unixTimestamp);
                        return 'Invalid Time';
                    }
                },
                formatDistance(distanceMeters) {
                    try {
                        const distance = Number(distanceMeters);
                        if (isNaN(distance) || distance < 0) return null;
                        if (distance < 1000) return `${Math.round(distance)}m`;
                        return `${(distance / 1000).toFixed(1)}km`;
                    } catch {
                        return null;
                    }
                },
                sanitizeText(text) {
                    try {
                        if (text === null || typeof text === 'undefined') text = '';
                        if (typeof text !== 'string') text = String(text);
                        const temp = document.createElement('div');
                        temp.textContent = text;
                        return temp.innerHTML;
                    } catch {
                        return String(text || '');
                    }
                },
                getEstimatedDistance(nodeId) {
                    try {
                        const node = App.state.nodes[nodeId];
                        const localNode = App.state.nodes[App.state.currentUserNodeId];
    
                        if (!localNode?.position?.latitude || !localNode?.position?.longitude || localNode.position.latitude === 0 || localNode.position.longitude === 0) {
                            return null;
                        }
                        if (!node?.position?.latitude || !node?.position?.longitude || node.position.latitude === 0 || node.position.longitude === 0) {
                            return null;
                        }
    
                        const lat1 = node.position.latitude;
                        const lon1 = node.position.longitude;
                        const lat2 = localNode.position.latitude;
                        const lon2 = localNode.position.longitude;
    
                        const R = 6371e3; 
                        const φ1 = lat1 * Math.PI/180;
                        const φ2 = lat2 * Math.PI/180;
                        const Δφ = (lat2-lat1) * Math.PI/180;
                        const Δλ = (lon2-lon1) * Math.PI/180;
    
                        const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                                  Math.cos(φ1) * Math.cos(φ2) *
                                  Math.sin(Δλ/2) * Math.sin(Δλ/2);
                        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    
                        return Math.round(R * c);
                    } catch (e) {
                        return null;
                    }
                },
                getIsMsgFromCurrentUser(senderId) {
                    if (!App.state.currentUserNodeId || App.state.currentUserNodeId === App.config.UNKNOWN_USER_ID || !senderId) {
                        return false;
                    }
                    const currentUserIdStr = String(App.state.currentUserNodeId).startsWith('!') ? String(App.state.currentUserNodeId) : `!${String(App.state.currentUserNodeId)}`;
                    const senderIdStr = String(senderId).startsWith('!') ? String(senderId) : `!${String(senderId)}`;
                    return senderIdStr === currentUserIdStr;
                },
                extractTextFromPayload(potentialText) {
                    let text = '';
                    if (typeof potentialText === 'string') {
                        text = potentialText;
                    } else if (potentialText && typeof potentialText === 'object' && potentialText.type === 'Buffer' && Array.isArray(potentialText.data)) {
                        try {
                            text = String.fromCharCode.apply(null, new Uint8Array(potentialText.data));
                        } catch (e) {
                            console.warn("Buffer decode failed, treating as non-text data.", e);
                            text = '[Binary Data]';
                        }
                    } else if (potentialText !== null && typeof potentialText !== 'undefined') {
                        text = String(potentialText);
                    }
                    return text;
                },
                getNodeBatteryLevel(senderId, decodedPacketPart, telemetryPacketPart) {
                    let batteryLevel = null;
                    const nodeDataSource = App.state.nodes[senderId];
    
                    const deviceMetricsSource = decodedPacketPart?.telemetry?.deviceMetrics ??
                                                telemetryPacketPart?.deviceMetrics ??
                                                nodeDataSource?.deviceMetrics;
    
                    if (deviceMetricsSource?.batteryLevel !== undefined && deviceMetricsSource.batteryLevel !== null) {
                        batteryLevel = deviceMetricsSource.batteryLevel;
                    } else if (nodeDataSource?.batteryLevel !== undefined && nodeDataSource.batteryLevel !== null) {
                        batteryLevel = nodeDataSource.batteryLevel;
                    }
                    return batteryLevel;
                }
            }
        };
    
        document.addEventListener('DOMContentLoaded', () => {
            App.init();
        });
    </script>
